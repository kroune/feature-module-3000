name: measure-agp-commits

# End-to-end memory measurement of two AGP refs (typically a studio-main snapshot and a
# branch with a sync optimization) against this 3000-module sync OOM repro, in a single
# run:
#
#   resolve -> build-agp (base + candidate in parallel) -> sync (base + candidate in parallel)
#
# - resolve:   turns AGP refs (branch / tag / short or full SHA) into full SHAs.
# - build-agp: builds AGP from the given platform/tools/base ref via a minimal AOSP
#              `repo` checkout (manifest branch studio-main) and
#              `tools/gradlew :publishAndroidGradleLocal`, and publishes the resulting
#              maven repo (out/repo) as release asset agp-repo-<sha12>.tar.gz (+ the
#              build version as agp-version-<sha12>.txt) under tag agp-build-<sha12>.
#              Skipped when that release already exists.
# - sync:      the same cold headless Android Studio sync as measure-commits (see that
#              file for the rationale: watchdog, zram, gzipped heap dumps), with the
#              project syncing against the freshly built AGP repo: the sync step appends
#              `agpOverrideRepoUrl` / `agpOverrideVersion` to gradle.properties (honored
#              by settings.gradle.kts + build-logic/settings.gradle.kts). The Gradle
#              distribution is FIXED for both legs via gradle_distribution_url, so only
#              the AGP side differs.
#              Publishes run-agp-<run_number>-<base|candidate> releases with the daemon
#              heap dump.
#
# Usage:
#   gh workflow run measure-agp-commits.yml \
#     -f candidate_repo=kroune/platform-tools-base -f candidate_ref=lazy-configurations
on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: "Baseline tools/base GitHub repo (owner/name)"
        default: "kroune/platform-tools-base"
        type: string
      base_ref:
        description: "Baseline tools/base commit SHA / branch / tag"
        default: "studio-main"
        type: string
      candidate_repo:
        description: "Candidate tools/base GitHub repo (owner/name)"
        default: "kroune/platform-tools-base"
        type: string
      candidate_ref:
        description: "Candidate tools/base commit SHA / branch / tag"
        default: "lazy-configurations"
        type: string
      gradle_distribution_url:
        description: "Fixed Gradle bin zip URL used for BOTH legs (default: transformed-artifact-files-only build)"
        default: "https://github.com/kroune/feature-module-3000/releases/download/gradle-build-0fde246a8947/gradle-0fde246a8947-bin.zip"
        type: string
      daemon_xmx:
        description: "Gradle daemon heap, -Xmx = -Xms (use 2g for a quick smoke run)"
        default: "9g"
        type: string
      studio_url:
        description: "Android Studio linux.tar.gz URL (from jb.gg/android-studio-releases-list.json)"
        default: "https://edgedl.me.gvt1.com/android/studio/ide-zips/2026.1.2.10/android-studio-quail2-linux.tar.gz"
        type: string
      gradle_profiler_url:
        description: "gradle-profiler dist zip URL (patched build from the build-profiler workflow; upstream 0.25.2 times out waiting for the IDE plugin)"
        default: "https://github.com/kroune/feature-module-3000/releases/download/patched-profiler/gradle-profiler-0.25.2.zip"
        type: string

permissions:
  contents: write # publish build + result releases

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve refs to SHAs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base_sha=$(gh api 'repos/${{ inputs.base_repo }}/commits/${{ inputs.base_ref }}' -q .sha)
          cand_sha=$(gh api 'repos/${{ inputs.candidate_repo }}/commits/${{ inputs.candidate_ref }}' -q .sha)
          echo "base:      ${{ inputs.base_repo }}@${{ inputs.base_ref }} -> $base_sha"
          echo "candidate: ${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }} -> $cand_sha"
          matrix=$(jq -nc \
            --arg br '${{ inputs.base_repo }}' --arg bs "$base_sha" \
            --arg cr '${{ inputs.candidate_repo }}' --arg cs "$cand_sha" \
            '[{name:"base",repo:$br,sha:$bs},{name:"candidate",repo:$cr,sha:$cs}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "## Resolved tools/base refs"
            echo
            echo "- base: \`${{ inputs.base_repo }}@${{ inputs.base_ref }}\` = \`$base_sha\`"
            echo "- candidate: \`${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}\` = \`$cand_sha\`"
            echo "- Gradle distribution (fixed for both legs): ${{ inputs.gradle_distribution_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-agp:
    needs: resolve
    runs-on: ubuntu-latest
    # A cold AGP build (incl. the AOSP repo sync + dependency unpack) is slow.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Release coordinates / cache check
        id: cached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          tag="agp-build-$sha12"
          echo "sha12=$sha12" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=agp-repo-$sha12.tar.gz" >> "$GITHUB_OUTPUT"
          echo "version_asset=agp-version-$sha12.txt" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping the build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        if: steps.cached.outputs.exists != 'true'
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      - uses: actions/setup-java@v4
        if: steps.cached.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install repo
        if: steps.cached.outputs.exists != 'true'
        run: |
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > "$RUNNER_TEMP/repo"
          chmod +x "$RUNNER_TEMP/repo"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          # $GITHUB_PATH only takes effect in later steps; use the full path here.
          "$RUNNER_TEMP/repo" version

      # Minimal studio-main checkout for building AGP: the gradle build resolves its
      # dependencies exclusively from the checked-in offline maven repo
      # (prebuilts/tools/common/m2) and its JDK from prebuilts/studio/jdk. The bazel
      # invocation behind :publishAndroidGradleLocal additionally needs tools/idea
      # (intellij SDK), tools/adt/idea (studio.bzl toolchains + layoutlib targets),
      # the apkzlib/analytics-library/apksig sibling projects referenced from
      # tools/base BUILD files, and the native toolchain prebuilts.
      # This exact set was validated locally end-to-end; every entry is load-bearing.
      - name: AOSP repo sync (minimal set)
        if: steps.cached.outputs.exists != 'true'
        run: |
          set -euo pipefail
          mkdir aosp && cd aosp
          repo init -u https://android.googlesource.com/platform/manifest -b studio-main --depth=1
          # prebuilts/tools carries the offline maven repo at common/m2; prebuilts/studio/sdk
          # is not a repo project (its BUILD/README are linkfiles from tools/base).
          repo sync -c -j8 \
            tools/base tools/buildSrc tools/gradle tools/external/gradle \
            tools/external/fat32lib tools/data-binding \
            tools/idea tools/adt/idea \
            tools/apkzlib tools/analytics-library tools/apksig \
            build/bazel \
            external/jarjar external/gflags external/googletest \
            external/nanopb-c external/dexter \
            prebuilts/studio/jdk prebuilts/studio/layoutlib prebuilts/tools \
            prebuilts/python/linux-x86 \
            prebuilts/clang/host/linux-x86 \
            prebuilts/gcc/linux-x86/host/x86_64-linux-glibc2.17-4.8
          # prebuilts/bazel/linux-x86_64 cannot be repo-synced: the manifest leaves it on the
          # default revision (mirror-goog-studio-main), which does not exist on that repo.
          # mirror-goog-emu-main-dev is the branch tracking studio development (bazelisk).
          git clone --depth 1 -b mirror-goog-emu-main-dev \
            https://android.googlesource.com/platform/prebuilts/bazel/linux-x86_64 \
            prebuilts/bazel/linux-x86_64

      - name: Check out the target tools/base ref
        if: steps.cached.outputs.exists != 'true'
        working-directory: aosp/tools/base
        run: |
          git fetch https://github.com/${{ matrix.repo }}.git '${{ matrix.sha }}'
          git checkout FETCH_HEAD
          git log --oneline -1

      - name: Build and publish AGP locally
        if: steps.cached.outputs.exists != 'true'
        working-directory: aosp/tools
        env:
          # Bazelisk would otherwise pick the latest bazel (9.x), whose
          # java_common.JavaRuntimeInfo removal breaks kotlin_common.bzl.
          USE_BAZEL_VERSION: "8.7.0"
        run: ./gradlew :publishAndroidGradleLocal --console=plain

      - name: Publish the AGP repo as a release
        if: steps.cached.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -d aosp/out/repo ] || { echo "aosp/out/repo missing" >&2; exit 1; }
          # dev build version: BUILD_VERSION's numeric prefix + "-dev" (buildSrc/base/version.gradle)
          version=$(grep -oP 'BUILD_VERSION = "\K[0-9.]+' aosp/tools/base/common/release_version.bzl | head -1)-dev
          echo "AGP build version: $version"
          echo "$version" > '${{ steps.cached.outputs.version_asset }}'
          tar -czf '${{ steps.cached.outputs.asset }}' -C aosp/out repo
          du -sh '${{ steps.cached.outputs.asset }}'
          {
            echo "## AGP built (${{ matrix.name }})"
            echo
            echo "- Source: \`${{ matrix.repo }}@${{ matrix.sha }}\`"
            echo "- Build version: \`$version\`"
            echo "- Asset: \`${{ steps.cached.outputs.asset }}\` ($(stat -c%s '${{ steps.cached.outputs.asset }}') bytes)"
          } | tee -a "$GITHUB_STEP_SUMMARY" summary.md
          gh release create '${{ steps.cached.outputs.tag }}' -R '${{ github.repository }}' \
            --title "AGP local repo (${{ matrix.repo }}@${{ steps.cached.outputs.sha12 }})" \
            --notes-file summary.md \
            '${{ steps.cached.outputs.asset }}' '${{ steps.cached.outputs.version_asset }}'

  # Same sync logic as the sync job in measure-idea-commits.yml — kept as a copy on
  # purpose (single self-contained workflow run). Differences: no tooling-extension
  # overlay; instead the freshly built AGP repo + version are appended to
  # gradle.properties as agpOverrideRepoUrl / agpOverrideVersion, and release tags use
  # the run-agp- prefix.
  sync:
    needs: [resolve, build-agp]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Compute coordinates
        id: coords
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          echo "sha12=$sha12" >> "$GITHUB_OUTPUT"
          echo "gradle_url=${{ inputs.gradle_distribution_url }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "== before =="; df -h /; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      # Compressed RAM swap: zero disk cost, keeps the kernel OOM-killer away from the
      # daemon so the JVM itself throws OutOfMemoryError (which is what writes the dump).
      - name: Add zram swap
        run: |
          if sudo modprobe zram; then
            echo lz4 | sudo tee /sys/block/zram0/comp_algorithm
            echo 8G | sudo tee /sys/block/zram0/disksize
            sudo mkswap /dev/zram0 && sudo swapon -p 100 /dev/zram0
          else
            echo "zram unavailable, continuing without extra swap"
          fi
          free -h; swapon --show

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null && SDKM=sdkmanager
          yes | "$SDKM" --licenses >/dev/null || true
          if ! ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            "$SDKM" "platforms;android-37.0"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Pin Gradle distribution
        run: |
          url='${{ steps.coords.outputs.gradle_url }}'
          esc=$(printf '%s' "$url" | sed 's/[&\\]/\\&/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$esc|" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      # Point the project at the AGP built by the build-agp job (see
      # settings.gradle.kts / build-logic/settings.gradle.kts).
      - name: Fetch the built AGP repo and wire the override
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha12='${{ steps.coords.outputs.sha12 }}'
          gh release download "agp-build-$sha12" -R '${{ github.repository }}' \
            -p "agp-repo-$sha12.tar.gz" -p "agp-version-$sha12.txt" --clobber
          mkdir -p "$RUNNER_TEMP/agp-repo"
          tar -xzf "agp-repo-$sha12.tar.gz" -C "$RUNNER_TEMP/agp-repo"
          version=$(cat "agp-version-$sha12.txt")
          ls "$RUNNER_TEMP/agp-repo/repo/com/android/tools/build/gradle/$version" | head
          {
            # leading blank line: a missing trailing newline in gradle.properties would
            # otherwise glue agpOverrideRepoUrl onto the last property and silently
            # drop the repo override (both legs then resolve the same gmaven AGP)
            echo
            echo "agpOverrideRepoUrl=file://$RUNNER_TEMP/agp-repo/repo"
            echo "agpOverrideVersion=$version"
          } >> gradle.properties
          # fail loudly if the override did not land as its own property
          grep -q "^agpOverrideRepoUrl=file://" gradle.properties
          # build-logic is an INCLUDED BUILD: it does not see the root gradle.properties,
          # so the version override (which lives in its catalog) must also land in its own
          # gradle.properties — otherwise both legs silently compile against the catalog AGP
          {
            echo
            echo "agpOverrideRepoUrl=file://$RUNNER_TEMP/agp-repo/repo"
            echo "agpOverrideVersion=$version"
          } >> build-logic/gradle.properties
          grep -q "^agpOverrideVersion=" build-logic/gradle.properties
          echo "AGP override: file://$RUNNER_TEMP/agp-repo/repo @ $version"

      - name: Patch gradle.properties (heap cap, dump path, JDK 25 compact headers)
        run: |
          XMX='${{ inputs.daemon_xmx }}'
          mkdir -p heap-dumps/daemon heap-dumps/kotlin
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xmx[0-9]+[gGmM]|-Xmx$XMX|" gradle.properties
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xms[0-9]+[gGmM]|-Xms$XMX|" gradle.properties
          sed -i "/^org.gradle.jvmargs=/ s|\$| -XX:HeapDumpPath=$GITHUB_WORKSPACE/heap-dumps/daemon -XX:HeapDumpGzipLevel=1 -XX:+UseCompactObjectHeaders|" gradle.properties
          sed -i "/^kotlin.daemon.jvmargs=/ s|\$| -XX:HeapDumpPath=$GITHUB_WORKSPACE/heap-dumps/kotlin -XX:HeapDumpGzipLevel=1|" gradle.properties
          cat gradle.properties

      - name: Install gradle-profiler
        run: |
          curl -sL -o gp.zip "${{ inputs.gradle_profiler_url }}"
          mkdir -p "$RUNNER_TEMP/gp" && unzip -q gp.zip -d "$RUNNER_TEMP/gp" && rm gp.zip
          GP_BIN=$(find "$RUNNER_TEMP/gp" -type f -name gradle-profiler -path "*/bin/*" | head -1)
          echo "Found profiler at $GP_BIN"
          echo "$(dirname "$GP_BIN")" >> "$GITHUB_PATH"
          "$GP_BIN" --version

      - name: Install Android Studio
        run: |
          curl -sL -o studio.tar.gz "${{ inputs.studio_url }}"
          mkdir -p "$RUNNER_TEMP/studio"
          tar -xzf studio.tar.gz -C "$RUNNER_TEMP/studio" --strip-components=1
          rm studio.tar.gz
          ls "$RUNNER_TEMP/studio/bin"
          df -h /

      - name: Run Android Studio sync via gradle-profiler
        id: bench
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/guh
          # Force gradle-profiler to launch the IDE with its headless starter
          # (full-GUI Studio hangs on project frame creation on CI).
          GRADLE_PROFILER_OPTS: "-Didea.tests.headless=true"
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          mkdir -p heap-dumps/ide
          sed "s|@HEAP_DUMP_DIR@|$GITHUB_WORKSPACE/heap-dumps|" sync.scenarios > sync.scenarios.ci
          cat sync.scenarios.ci
          set +e
          # gradle-profiler hangs forever when the daemon dies mid-inspection/sync (the TAPI
          # call never returns). Run it in the background and watch for the dump instead:
          # once a size-stable daemon dump exists, the OOM is captured and we tear down.
          xvfb-run -a gradle-profiler --benchmark \
            --single-shot \
            --project-dir . \
            --scenario-file sync.scenarios.ci \
            --studio-install-dir "$RUNNER_TEMP/studio" \
            --output-dir results \
            > profiler.log 2>&1 &
          PROF=$!
          DUMP_FOUND=""
          while kill -0 $PROF 2>/dev/null; do
            f=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              # JDK 25+ writes gzipped heap dumps in parallel segments: the main file
              # holds the header (small and size-stable) while workers write *.p0/*.p1/...
              # segments that are merged at the end. A stable main file with segments
              # present means the dump is still in progress — keep waiting.
              if ls heap-dumps/daemon/*.p[0-9] >/dev/null 2>&1; then
                sleep 30
                continue
              fi
              s1=$(stat -c%s "$f"); sleep 30; s2=$(stat -c%s "$f" 2>/dev/null || echo 0)
              if [ "$s1" -gt 0 ] && [ "$s1" = "$s2" ]; then
                echo "watchdog: complete daemon dump detected ($f, $s1 bytes) — terminating the run"
                DUMP_FOUND=1
                kill -TERM $PROF 2>/dev/null || true
                sleep 10
                break
              fi
            else
              sleep 30
            fi
          done
          kill -KILL $PROF 2>/dev/null || true
          pkill -KILL -f gradle-profiler 2>/dev/null || true
          pkill -KILL -f GradleDaemon 2>/dev/null || true
          pkill -KILL -f studio 2>/dev/null || true
          wait $PROF 2>/dev/null; rc=$?
          echo "gradle-profiler exit code: $rc (watchdog_dump=$DUMP_FOUND)" | tee -a profiler.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "== profiler.log tail =="
          tail -100 profiler.log || true
          exit 0

      - name: Collect dumps
        if: always()
        run: |
          find heap-dumps -name '*.hprof' -exec gzip -1 {} \; 2>/dev/null || true
          ls -laR heap-dumps/ || true
          # Leftover dump segments mean the dump was truncated (e.g. killed mid-write)
          if ls heap-dumps/daemon/*.p[0-9] >/dev/null 2>&1; then
            echo "WARNING: truncated heap dump (unmerged segments present)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Preserve the Gradle daemon logs for diagnostics (the sync daemon uses the
          # project's gradle-user-home; the profiler's own daemons use $RUNNER_TEMP/guh)
          mkdir -p daemon-logs
          cp gradle-user-home/daemon/*/daemon-*.out.log daemon-logs/ 2>/dev/null || true
          cp '${{ runner.temp }}'/guh/daemon/*/daemon-*.out.log daemon-logs/ 2>/dev/null || true
          tar -czf daemon-logs.tar.gz -C daemon-logs . 2>/dev/null || true
          # IDE thread dumps ("Cannot execute background write action" warnings point here)
          # — the prime diagnostic when Studio hangs during project open.
          if [ -d results/studio-sandbox/system ]; then
            find results/studio-sandbox/system -maxdepth 1 -type d -name 'threadDumps*' \
              -exec tar -czf ide-thread-dumps.tar.gz {} + 2>/dev/null || true
          fi
          du -sh results 2>/dev/null || true
          df -h /; free -h

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agp-sync-benchmark-dumps-${{ github.run_number }}-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            heap-dumps/
            profiler.log
            sync.scenarios.ci
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            results/*.csv
            results/*.html
            results/*.log
            results/**/log/**
            results/**/logs/**
            ide-thread-dumps.tar.gz

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Android Studio sync benchmark (${{ matrix.name }}: \`${{ matrix.repo }}@${{ matrix.sha }}\`)"
            echo
            echo "- Gradle distribution (fixed): \`${{ steps.coords.outputs.gradle_url }}\`"
            echo "- AGP build: \`agp-build-${{ steps.coords.outputs.sha12 }}\`"
            echo "- Daemon heap: \`${{ inputs.daemon_xmx }}\` (JDK 25, \`-XX:+UseCompactObjectHeaders\`)"
            echo "- Android Studio: \`${{ inputs.studio_url }}\`"
            echo "- gradle-profiler: \`${{ inputs.gradle_profiler_url }}\`"
            echo "- gradle-profiler exit code: \`${{ steps.bench.outputs.rc }}\`"
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            ls -laR heap-dumps/ 2>/dev/null || echo "no heap-dumps dir"
            echo
            dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
            if [ -n "$dump" ]; then
              echo "**OOM reproduced — Gradle daemon heap dump captured: \`$dump\` ($(stat -c%s "$dump") bytes)**"
            else
              echo "**No daemon heap dump produced**"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" summary.md

      # Results go to a release (not just artifacts): release assets have fast,
      # stable, publicly accessible download URLs — Actions artifact downloads are slow.
      - name: Publish results as a release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="run-agp-${{ github.run_number }}-${{ matrix.name }}"
          gver=$(basename '${{ steps.coords.outputs.gradle_url }}' | sed -E 's/^gradle-//; s/-(bin|all)\.zip$//')
          dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
          assets=()
          if [ -n "$dump" ]; then
            cp "$dump" daemon.hprof.gz
            size=$(stat -c%s daemon.hprof.gz)
            outcome="OOM reproduced ($size bytes gzipped)"
            # GitHub release assets are capped at 2 GiB — split larger dumps.
            if [ "$size" -gt 2000000000 ]; then
              split -b 1900m daemon.hprof.gz daemon.hprof.gz.part-
              rm daemon.hprof.gz
              assets+=(daemon.hprof.gz.part-*)
              outcome="$outcome, split into $(ls daemon.hprof.gz.part-* | wc -l) parts"
              {
                echo
                echo "**Note:** \`daemon.hprof.gz\` exceeds the 2 GiB release-asset limit and is split into parts. Reassemble with:"
                echo '```'
                echo "cat daemon.hprof.gz.part-* > daemon.hprof.gz"
                echo '```'
              } >> summary.md
            else
              assets+=(daemon.hprof.gz)
            fi
          elif [ "${{ steps.bench.outputs.rc }}" = "0" ]; then
            outcome="sync completed, no OOM"
          else
            outcome="failed, no dump"
          fi
          for f in profiler.log summary.md sync.scenarios.ci gradle.properties gradle/wrapper/gradle-wrapper.properties \
                   results/benchmark.csv results/benchmark.html results/studio-sandbox/logs/idea.log daemon-logs.tar.gz ide-thread-dumps.tar.gz; do
            [ -f "$f" ] && assets+=("$f")
          done
          ide=$(ls -S heap-dumps/ide/*.hprof.gz 2>/dev/null | head -1)
          [ -n "$ide" ] && cp "$ide" ide.hprof.gz && assets+=(ide.hprof.gz)
          gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$tag" -R '${{ github.repository }}' \
            --title "AGP sync run #${{ github.run_number }} (${{ matrix.name }}: ${{ matrix.repo }}@${{ steps.coords.outputs.sha12 }}) — Gradle $gver, daemon ${{ inputs.daemon_xmx }} — $outcome" \
            --notes-file summary.md \
            "${assets[@]}"
          echo "**Results published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag**" >> "$GITHUB_STEP_SUMMARY"

      # Kick off MAT index building in the heap-report repo; a no-op when the PAT
      # secret is absent or no daemon dump was produced.
      - name: Trigger MAT index build (heap-report)
        if: always()
        env:
          PAT: ${{ secrets.HEAP_REPORT_PAT }}
        run: |
          tag="run-agp-${{ github.run_number }}-${{ matrix.name }}"
          if [ -z "$PAT" ]; then
            echo "HEAP_REPORT_PAT not set — skipping index-build dispatch"
            exit 0
          fi
          dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
          if [ -z "$dump" ]; then
            echo "no daemon dump — skipping index-build dispatch"
            exit 0
          fi
          GH_TOKEN="$PAT" gh api repos/kroune/heap-report/dispatches \
            -f event_type=build-indexes \
            -F "client_payload[source_repo]=${{ github.repository }}" \
            -F "client_payload[release_tag]=$tag"
          echo "dispatched build-indexes for $tag"

      - name: Verdict
        if: always()
        run: |
          dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
          if [ -n "$dump" ] && [ "$(stat -c%s "$dump")" -gt 10485760 ]; then
            echo "OK: daemon heap dump captured (OOM reproduced): $dump"
            exit 0
          fi
          if [ "${{ steps.bench.outputs.rc }}" = "0" ]; then
            echo "OK: sync completed without OOM."
            exit 0
          fi
          echo "FAIL: profiler errored and no daemon dump was captured."
          exit 1
