name: sync-benchmark

# Reproduces the Gradle daemon OutOfMemoryError during an Android Studio sync of this
# 3000-module project on a 16 GB runner, and uploads the (gzipped) heap dump.
#
# The benchmark is manual-only: every run is expensive and produces multi-GB artifacts.
on:
  workflow_dispatch:
    inputs:
      gradle_distribution_url:
        description: "Gradle distribution zip URL (stable / RC / nightly / custom build)"
        default: "https://services.gradle.org/distributions/gradle-9.7.0-rc-1-bin.zip"
        type: string
      daemon_xmx:
        description: "Gradle daemon heap, -Xmx = -Xms (use 2g for a quick smoke run)"
        default: "10g"
        type: string
      studio_url:
        description: "Android Studio linux.tar.gz URL (from jb.gg/android-studio-releases-list.json)"
        default: "https://edgedl.me.gvt1.com/android/studio/ide-zips/2026.1.2.10/android-studio-quail2-linux.tar.gz"
        type: string
      gradle_profiler_url:
        description: "gradle-profiler dist zip URL (patched build from the build-profiler workflow; upstream 0.25.2 times out waiting for the IDE plugin)"
        default: "https://github.com/kroune/feature-module-3000/releases/download/patched-profiler/gradle-profiler-0.25.2.zip"
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "== before =="; df -h /; free -h
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/share/swift \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          docker system prune -af || true
          echo "== after =="; df -h /

      # Compressed RAM swap: zero disk cost, keeps the kernel OOM-killer away from the
      # daemon so the JVM itself throws OutOfMemoryError (which is what writes the dump).
      - name: Add zram swap
        run: |
          if sudo modprobe zram; then
            echo lz4 | sudo tee /sys/block/zram0/comp_algorithm
            echo 8G | sudo tee /sys/block/zram0/disksize
            sudo mkswap /dev/zram0 && sudo swapon -p 100 /dev/zram0
          else
            echo "zram unavailable, continuing without extra swap"
          fi
          free -h; swapon --show

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null && SDKM=sdkmanager
          yes | "$SDKM" --licenses >/dev/null || true
          if ! ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            "$SDKM" "platforms;android-37.0"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Pin Gradle distribution
        run: |
          url='${{ inputs.gradle_distribution_url }}'
          esc=$(printf '%s' "$url" | sed 's/[&\\]/\\&/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$esc|" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Patch gradle.properties (heap cap, dump path, JDK 25 compact headers)
        run: |
          XMX='${{ inputs.daemon_xmx }}'
          mkdir -p heap-dumps/daemon heap-dumps/kotlin
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xmx[0-9]+[gGmM]|-Xmx$XMX|" gradle.properties
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xms[0-9]+[gGmM]|-Xms$XMX|" gradle.properties
          sed -i "/^org.gradle.jvmargs=/ s|\$| -XX:HeapDumpPath=$GITHUB_WORKSPACE/heap-dumps/daemon -XX:HeapDumpGzipLevel=1 -XX:+UseCompactObjectHeaders|" gradle.properties
          sed -i "/^kotlin.daemon.jvmargs=/ s|\$| -XX:HeapDumpPath=$GITHUB_WORKSPACE/heap-dumps/kotlin -XX:HeapDumpGzipLevel=1|" gradle.properties
          cat gradle.properties

      - name: Install gradle-profiler
        run: |
          curl -sL -o gp.zip "${{ inputs.gradle_profiler_url }}"
          mkdir -p "$RUNNER_TEMP/gp" && unzip -q gp.zip -d "$RUNNER_TEMP/gp" && rm gp.zip
          GP_BIN=$(find "$RUNNER_TEMP/gp" -type f -name gradle-profiler -path "*/bin/*" | head -1)
          echo "Found profiler at $GP_BIN"
          echo "$(dirname "$GP_BIN")" >> "$GITHUB_PATH"
          "$GP_BIN" --version

      - name: Install Android Studio
        run: |
          curl -sL -o studio.tar.gz "${{ inputs.studio_url }}"
          mkdir -p "$RUNNER_TEMP/studio"
          tar -xzf studio.tar.gz -C "$RUNNER_TEMP/studio" --strip-components=1
          rm studio.tar.gz
          ls "$RUNNER_TEMP/studio/bin"
          df -h /

      - name: Run Android Studio sync via gradle-profiler
        id: bench
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/guh
          # Force gradle-profiler to launch the IDE with its headless starter
          # (full-GUI Studio hangs on project frame creation on CI).
          GRADLE_PROFILER_OPTS: "-Dide.tests.headless=true"
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          mkdir -p heap-dumps/ide
          sed "s|@HEAP_DUMP_DIR@|$GITHUB_WORKSPACE/heap-dumps|" sync.scenarios > sync.scenarios.ci
          cat sync.scenarios.ci
          set +e
          # gradle-profiler hangs forever when the daemon dies mid-inspection/sync (the TAPI
          # call never returns). Run it in the background and watch for the dump instead:
          # once a size-stable daemon dump exists, the OOM is captured and we tear down.
          xvfb-run -a gradle-profiler --benchmark \
            --single-shot \
            --project-dir . \
            --scenario-file sync.scenarios.ci \
            --studio-install-dir "$RUNNER_TEMP/studio" \
            --output-dir results \
            > profiler.log 2>&1 &
          PROF=$!
          DUMP_FOUND=""
          while kill -0 $PROF 2>/dev/null; do
            f=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              s1=$(stat -c%s "$f"); sleep 30; s2=$(stat -c%s "$f" 2>/dev/null || echo 0)
              if [ "$s1" -gt 0 ] && [ "$s1" = "$s2" ]; then
                echo "watchdog: complete daemon dump detected ($f, $s1 bytes) — terminating the run"
                DUMP_FOUND=1
                kill -TERM $PROF 2>/dev/null || true
                sleep 10
                break
              fi
            else
              sleep 30
            fi
          done
          kill -KILL $PROF 2>/dev/null || true
          pkill -KILL -f gradle-profiler 2>/dev/null || true
          pkill -KILL -f GradleDaemon 2>/dev/null || true
          pkill -KILL -f studio 2>/dev/null || true
          wait $PROF 2>/dev/null; rc=$?
          echo "gradle-profiler exit code: $rc (watchdog_dump=$DUMP_FOUND)" | tee -a profiler.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "== profiler.log tail =="
          tail -100 profiler.log || true
          exit 0

      - name: Collect dumps
        if: always()
        run: |
          find heap-dumps -name '*.hprof' -exec gzip -1 {} \; 2>/dev/null || true
          ls -laR heap-dumps/ || true
          du -sh results 2>/dev/null || true
          df -h /; free -h

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-benchmark-dumps-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            heap-dumps/
            profiler.log
            sync.scenarios.ci
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            results/*.csv
            results/*.html
            results/*.log
            results/**/log/**
            results/**/logs/**

      - name: Job summary
        if: always()
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/guh
        run: |
          {
            echo "## Android Studio sync benchmark"
            echo
            echo "- Gradle distribution: \`${{ inputs.gradle_distribution_url }}\`"
            echo "- Daemon heap: \`${{ inputs.daemon_xmx }}\` (JDK 25, \`-XX:+UseCompactObjectHeaders\`)"
            echo "- Android Studio: \`${{ inputs.studio_url }}\`"
            echo "- gradle-profiler: \`${{ inputs.gradle_profiler_url }}\`"
            echo "- gradle-profiler exit code: \`${{ steps.bench.outputs.rc }}\`"
            echo
            echo '```'
            ./gradlew --version 2>/dev/null | sed -n '1,10p' || true
            echo '```'
            echo
            ls -laR heap-dumps/ 2>/dev/null || echo "no heap-dumps dir"
            echo
            dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
            if [ -n "$dump" ]; then
              echo "**OOM reproduced — Gradle daemon heap dump captured: \`$dump\` ($(stat -c%s "$dump") bytes)**"
            else
              echo "**No daemon heap dump produced**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        if: always()
        run: |
          dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
          if [ -n "$dump" ] && [ "$(stat -c%s "$dump")" -gt 10485760 ]; then
            echo "OK: daemon heap dump captured (OOM reproduced): $dump"
            exit 0
          fi
          if [ "${{ steps.bench.outputs.rc }}" = "0" ]; then
            echo "OK: sync completed without OOM."
            exit 0
          fi
          echo "FAIL: profiler errored and no daemon dump was captured."
          exit 1
