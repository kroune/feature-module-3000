name: measure-idea-commits

# End-to-end memory measurement of two IntelliJ refs (typically master and a branch with
# a Gradle-sync optimization) against this 3000-module sync OOM repro, in a single run:
#
#   resolve -> build-idea (base + candidate in parallel) -> sync (base + candidate in parallel)
#                                                        -> compare (only with dump_models=true)
#
# - resolve:    turns IDEA refs (branch / tag / short or full SHA) into full SHAs.
# - build-idea: builds the Gradle tooling-extension jars (toolingExtension-api +
#               toolingExtension-impl) from the IntelliJ sources via Bazel and publishes
#               them as release asset idea-tooling-<sha12>.zip under tag
#               idea-build-<sha12>. Skipped when that release already exists.
# - sync:       the same cold headless Android Studio sync as measure-commits (see that
#               file for the rationale: watchdog, zram, gzipped heap dumps), with the
#               Studio-bundled tooling-extension jars REPLACED by the freshly built ones
#               (the tooling extension runs inside the Gradle daemon during sync; the
#               rest of the IDE is untouched). The Gradle distribution is FIXED for both
#               legs via gradle_distribution_url, so only the IDE side differs.
#               Publishes an run-idea-<run_number>-<base|candidate> release with the
#               daemon heap dump.
# - compare:    with dump_models=true the sync also writes a text dump of the resolved
#               dependency models (enabled by -Didea.gradle.daemon.dependency.model.dump,
#               supported by both measured branches); compare downloads both legs' dumps
#               and publishes a per-configuration diff as run-idea-<run_number>-model-diff.
#
# Usage:
#   gh workflow run measure-idea-commits.yml \
#     -f base_ref=sync-baseline -f candidate_ref=sync-modern-dep-resolver
on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: "Baseline IntelliJ GitHub repo (owner/name)"
        default: "kroune/intellij-community"
        type: string
      base_ref:
        description: "Baseline IntelliJ commit SHA / branch / tag"
        default: "sync-baseline"
        type: string
      candidate_repo:
        description: "Candidate IntelliJ GitHub repo (owner/name)"
        default: "kroune/intellij-community"
        type: string
      candidate_ref:
        description: "Candidate IntelliJ commit SHA / branch / tag"
        default: "sync-modern-dep-resolver"
        type: string
      gradle_distribution_url:
        description: "Fixed Gradle bin zip URL used for BOTH legs (default: transformed-artifact-files-only build)"
        default: "https://github.com/kroune/feature-module-3000/releases/download/gradle-build-0fde246a8947/gradle-0fde246a8947-bin.zip"
        type: string
      daemon_xmx:
        description: "Gradle daemon heap, -Xmx = -Xms (use 2g for a quick smoke run)"
        default: "9g"
        type: string
      dump_models:
        description: "Also dump resolved dependency models and diff base vs candidate"
        default: false
        type: boolean
      studio_url:
        description: "Android Studio linux.tar.gz URL (from jb.gg/android-studio-releases-list.json)"
        default: "https://edgedl.me.gvt1.com/android/studio/ide-zips/2026.1.2.10/android-studio-quail2-linux.tar.gz"
        type: string
      gradle_profiler_url:
        description: "gradle-profiler dist zip URL (patched build from the build-profiler workflow; upstream 0.25.2 times out waiting for the IDE plugin)"
        default: "https://github.com/kroune/feature-module-3000/releases/download/patched-profiler/gradle-profiler-0.25.2.zip"
        type: string

permissions:
  contents: write # publish build + result releases

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Resolve refs to SHAs
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base_sha=$(gh api 'repos/${{ inputs.base_repo }}/commits/${{ inputs.base_ref }}' -q .sha)
          cand_sha=$(gh api 'repos/${{ inputs.candidate_repo }}/commits/${{ inputs.candidate_ref }}' -q .sha)
          echo "base:      ${{ inputs.base_repo }}@${{ inputs.base_ref }} -> $base_sha"
          echo "candidate: ${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }} -> $cand_sha"
          matrix=$(jq -nc \
            --arg br '${{ inputs.base_repo }}' --arg bs "$base_sha" \
            --arg cr '${{ inputs.candidate_repo }}' --arg cs "$cand_sha" \
            '[{name:"base",repo:$br,sha:$bs},{name:"candidate",repo:$cr,sha:$cs}]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          {
            echo "## Resolved IntelliJ refs"
            echo
            echo "- base: \`${{ inputs.base_repo }}@${{ inputs.base_ref }}\` = \`$base_sha\`"
            echo "- candidate: \`${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}\` = \`$cand_sha\`"
            echo "- Gradle distribution (fixed for both legs): ${{ inputs.gradle_distribution_url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-idea:
    needs: resolve
    runs-on: ubuntu-latest
    # A cold Bazel build of the tooling extension (incl. dependency downloads) is slow.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Release coordinates / cache check
        id: cached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          tag="idea-build-$sha12"
          echo "sha12=$sha12" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=idea-tooling-$sha12.zip" >> "$GITHUB_OUTPUT"
          echo "url=https://github.com/${{ github.repository }}/releases/download/$tag/idea-tooling-$sha12.zip" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R '${{ github.repository }}' >/dev/null 2>&1; then
            echo "Release $tag already exists — skipping the build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.cached.outputs.exists != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Check out IntelliJ sources
        if: steps.cached.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: idea-src
          fetch-depth: 1

      - name: Build Gradle tooling-extension jars
        if: steps.cached.outputs.exists != 'true'
        working-directory: idea-src
        run: |
          ./bazel.cmd build \
            //plugins/gradle/tooling-extension-api:toolingExtension \
            //plugins/gradle/tooling-extension-impl:toolingExtension-impl

      - name: Publish jars as a release
        if: steps.cached.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bin=idea-src/out/bazel-bin
          [ -d "$bin" ] || bin=idea-src/bazel-bin
          mkdir -p dist
          cp "$bin/plugins/gradle/tooling-extension-api/toolingExtension.jar" dist/gradle-tooling-extension-api.jar
          cp "$bin/plugins/gradle/tooling-extension-impl/toolingExtension-impl.jar" dist/gradle-tooling-extension-impl.jar
          (cd dist && zip -q "../${{ steps.cached.outputs.asset }}" *.jar)
          {
            echo "## IntelliJ Gradle tooling extension built (${{ matrix.name }})"
            echo
            echo "- Source: \`${{ matrix.repo }}@${{ matrix.sha }}\`"
            echo '- Jars:'
            ls -l dist | tail -n +2 | sed 's/^/  - /'
            echo "- Asset: \`${{ steps.cached.outputs.asset }}\`"
            echo "- URL: ${{ steps.cached.outputs.url }}"
          } | tee -a "$GITHUB_STEP_SUMMARY" summary.md
          gh release delete '${{ steps.cached.outputs.tag }}' --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create '${{ steps.cached.outputs.tag }}' -R '${{ github.repository }}' \
            --title "IDEA tooling extension (${{ matrix.repo }}@${{ steps.cached.outputs.sha12 }})" \
            --notes-file summary.md \
            '${{ steps.cached.outputs.asset }}'

  # Same sync logic as the sync job in measure-commits.yml — kept as a copy on purpose
  # (single self-contained workflow run). Differences: the Gradle distribution is a fixed
  # input for both legs, the Studio tooling-extension jars are overlaid from the
  # build-idea job, release tags use the run-idea- prefix, and dump_models=true enables
  # the dependency model dump.
  sync:
    needs: [resolve, build-idea]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Compute URLs
        id: urls
        run: |
          sha12=$(echo '${{ matrix.sha }}' | cut -c1-12)
          echo "idea_url=https://github.com/${{ github.repository }}/releases/download/idea-build-$sha12/idea-tooling-$sha12.zip" >> "$GITHUB_OUTPUT"
          echo "gradle_url=${{ inputs.gradle_distribution_url }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      # Compressed RAM swap: zero disk cost, keeps the kernel OOM-killer away from the
      # daemon so the JVM itself throws OutOfMemoryError (which is what writes the dump).
      - name: Add zram swap
        run: |
          if sudo modprobe zram; then
            echo lz4 | sudo tee /sys/block/zram0/comp_algorithm
            echo 8G | sudo tee /sys/block/zram0/disksize
            sudo mkswap /dev/zram0 && sudo swapon -p 100 /dev/zram0
          else
            echo "zram unavailable, continuing without extra swap"
          fi
          free -h; swapon --show

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK setup
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null && SDKM=sdkmanager
          yes | "$SDKM" --licenses >/dev/null || true
          if ! ls -d "$ANDROID_HOME"/platforms/android-37* >/dev/null 2>&1; then
            "$SDKM" "platforms;android-37.0"
          fi
          ls "$ANDROID_HOME/platforms"

      - name: Pin Gradle distribution
        run: |
          url='${{ steps.urls.outputs.gradle_url }}'
          esc=$(printf '%s' "$url" | sed 's/[&\\]/\\&/g')
          sed -i "s|^distributionUrl=.*|distributionUrl=$esc|" gradle/wrapper/gradle-wrapper.properties
          grep '^distributionUrl' gradle/wrapper/gradle-wrapper.properties

      - name: Patch gradle.properties (heap cap, dump path, JDK 25 compact headers)
        run: |
          XMX='${{ inputs.daemon_xmx }}'
          mkdir -p heap-dumps/daemon heap-dumps/kotlin model-dumps
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xmx[0-9]+[gGmM]|-Xmx$XMX|" gradle.properties
          sed -i -E "/^org.gradle.jvmargs=/ s|-Xms[0-9]+[gGmM]|-Xms$XMX|" gradle.properties
          sed -i "/^org.gradle.jvmargs=/ s|\$| -XX:HeapDumpPath=$GITHUB_WORKSPACE/heap-dumps/daemon -XX:HeapDumpGzipLevel=1 -XX:+UseCompactObjectHeaders|" gradle.properties
          sed -i "/^kotlin.daemon.jvmargs=/ s|\$| -XX:HeapDumpPath=$GITHUB_WORKSPACE/heap-dumps/kotlin -XX:HeapDumpGzipLevel=1|" gradle.properties
          if [ '${{ inputs.dump_models }}' = 'true' ]; then
            sed -i "/^org.gradle.jvmargs=/ s|\$| -Didea.gradle.daemon.dependency.model.dump=$GITHUB_WORKSPACE/model-dumps|" gradle.properties
          fi
          cat gradle.properties

      - name: Install gradle-profiler
        run: |
          curl -sL -o gp.zip "${{ inputs.gradle_profiler_url }}"
          mkdir -p "$RUNNER_TEMP/gp" && unzip -q gp.zip -d "$RUNNER_TEMP/gp" && rm gp.zip
          GP_BIN=$(find "$RUNNER_TEMP/gp" -type f -name gradle-profiler -path "*/bin/*" | head -1)
          echo "Found profiler at $GP_BIN"
          echo "$(dirname "$GP_BIN")" >> "$GITHUB_PATH"
          "$GP_BIN" --version

      - name: Install Android Studio
        run: |
          curl -sL -o studio.tar.gz "${{ inputs.studio_url }}"
          mkdir -p "$RUNNER_TEMP/studio"
          tar -xzf studio.tar.gz -C "$RUNNER_TEMP/studio" --strip-components=1
          rm studio.tar.gz
          ls "$RUNNER_TEMP/studio/bin"
          df -h /

      # The tooling extension runs inside the Gradle daemon during sync; replacing these
      # two jars is enough to swap the IDE-side dependency resolution implementation.
      - name: Overlay tooling-extension jars into Studio
        run: |
          set -euo pipefail
          curl -sL -o tooling.zip '${{ steps.urls.outputs.idea_url }}'
          mkdir -p "$RUNNER_TEMP/tooling" && unzip -q tooling.zip -d "$RUNNER_TEMP/tooling" && rm tooling.zip
          ls -l "$RUNNER_TEMP/tooling"
          for name in gradle-tooling-extension-api gradle-tooling-extension-impl; do
            target=$(find "$RUNNER_TEMP/studio/plugins" -name "$name.jar" | head -1)
            if [ -z "$target" ]; then
              echo "ERROR: $name.jar not found in the Studio installation" >&2
              exit 1
            fi
            echo "replacing $target"
            cp "$RUNNER_TEMP/tooling/$name.jar" "$target"
          done

      - name: Run Android Studio sync via gradle-profiler
        id: bench
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/guh
          # Force gradle-profiler to launch the IDE with its headless starter
          # (full-GUI Studio hangs on project frame creation on CI).
          GRADLE_PROFILER_OPTS: "-Dide.tests.headless=true"
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          mkdir -p heap-dumps/ide
          sed "s|@HEAP_DUMP_DIR@|$GITHUB_WORKSPACE/heap-dumps|" sync.scenarios > sync.scenarios.ci
          cat sync.scenarios.ci
          set +e
          # gradle-profiler hangs forever when the daemon dies mid-inspection/sync (the TAPI
          # call never returns). Run it in the background and watch for the dump instead:
          # once a size-stable daemon dump exists, the OOM is captured and we tear down.
          xvfb-run -a gradle-profiler --benchmark \
            --single-shot \
            --project-dir . \
            --scenario-file sync.scenarios.ci \
            --studio-install-dir "$RUNNER_TEMP/studio" \
            --output-dir results \
            > profiler.log 2>&1 &
          PROF=$!
          DUMP_FOUND=""
          while kill -0 $PROF 2>/dev/null; do
            f=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
            if [ -n "$f" ]; then
              # JDK 25+ writes gzipped heap dumps in parallel segments: the main file
              # holds the header (small and size-stable) while workers write *.p0/*.p1/...
              # segments that are merged at the end. A stable main file with segments
              # present means the dump is still in progress — keep waiting.
              if ls heap-dumps/daemon/*.p[0-9] >/dev/null 2>&1; then
                sleep 30
                continue
              fi
              s1=$(stat -c%s "$f"); sleep 30; s2=$(stat -c%s "$f" 2>/dev/null || echo 0)
              if [ "$s1" -gt 0 ] && [ "$s1" = "$s2" ]; then
                echo "watchdog: complete daemon dump detected ($f, $s1 bytes) — terminating the run"
                DUMP_FOUND=1
                kill -TERM $PROF 2>/dev/null || true
                sleep 10
                break
              fi
            else
              sleep 30
            fi
          done
          kill -KILL $PROF 2>/dev/null || true
          pkill -KILL -f gradle-profiler 2>/dev/null || true
          pkill -KILL -f GradleDaemon 2>/dev/null || true
          pkill -KILL -f studio 2>/dev/null || true
          wait $PROF 2>/dev/null; rc=$?
          echo "gradle-profiler exit code: $rc (watchdog_dump=$DUMP_FOUND)" | tee -a profiler.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "== profiler.log tail =="
          tail -100 profiler.log || true
          exit 0

      - name: Collect dumps
        if: always()
        run: |
          find heap-dumps -name '*.hprof' -exec gzip -1 {} \; 2>/dev/null || true
          ls -laR heap-dumps/ || true
          # Leftover dump segments mean the dump was truncated (e.g. killed mid-write)
          if ls heap-dumps/daemon/*.p[0-9] >/dev/null 2>&1; then
            echo "WARNING: truncated heap dump (unmerged segments present)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Preserve the Gradle daemon logs for diagnostics (the sync daemon uses the
          # project's gradle-user-home; the profiler's own daemons use $RUNNER_TEMP/guh)
          mkdir -p daemon-logs
          cp gradle-user-home/daemon/*/daemon-*.out.log daemon-logs/ 2>/dev/null || true
          cp '${{ runner.temp }}'/guh/daemon/*/daemon-*.out.log daemon-logs/ 2>/dev/null || true
          tar -czf daemon-logs.tar.gz -C daemon-logs . 2>/dev/null || true
          if [ '${{ inputs.dump_models }}' = 'true' ] && [ -n "$(ls -A model-dumps 2>/dev/null)" ]; then
            tar -czf model-dumps.tar.gz -C model-dumps .
            echo "model dump files: $(find model-dumps -type f | wc -l)"
            du -sh model-dumps.tar.gz
          fi
          du -sh results 2>/dev/null || true
          df -h /; free -h

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-sync-benchmark-dumps-${{ github.run_number }}-${{ matrix.name }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            heap-dumps/
            model-dumps.tar.gz
            profiler.log
            sync.scenarios.ci
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            results/*.csv
            results/*.html
            results/*.log
            results/**/log/**
            results/**/logs/**

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Android Studio sync benchmark (${{ matrix.name }}: \`${{ matrix.repo }}@${{ matrix.sha }}\`)"
            echo
            echo "- Gradle distribution (fixed): \`${{ steps.urls.outputs.gradle_url }}\`"
            echo "- Tooling extension jars: \`${{ steps.urls.outputs.idea_url }}\`"
            echo "- Daemon heap: \`${{ inputs.daemon_xmx }}\` (JDK 25, \`-XX:+UseCompactObjectHeaders\`)"
            echo "- Model dump enabled: \`${{ inputs.dump_models }}\`"
            echo "- Android Studio: \`${{ inputs.studio_url }}\`"
            echo "- gradle-profiler: \`${{ inputs.gradle_profiler_url }}\`"
            echo "- gradle-profiler exit code: \`${{ steps.bench.outputs.rc }}\`"
            echo "- workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            ls -laR heap-dumps/ 2>/dev/null || echo "no heap-dumps dir"
            echo
            dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
            if [ -n "$dump" ]; then
              echo "**OOM reproduced — Gradle daemon heap dump captured: \`$dump\` ($(stat -c%s "$dump") bytes)**"
            else
              echo "**No daemon heap dump produced**"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY" summary.md

      # tools/strip_hprof.py zeroes all primitive array contents IN PLACE (same byte
      # count, same offsets — MAT indexes stay valid for both variants), which gzips far
      # smaller. (shark-cli strip-hprof is unusable here: it buffers the whole heap run
      # in memory and int32-overflows the record length past 2 GiB.)
      - name: Strip daemon heap dump
        if: always()
        run: |
          dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
          if [ -z "$dump" ]; then
            echo "no daemon dump — skipping strip"
            exit 0
          fi
          if ls heap-dumps/daemon/*.p[0-9] >/dev/null 2>&1; then
            echo "unmerged dump segments present (truncated dump) — skipping strip"
            exit 0
          fi
          # the raw dump decompresses to ~18 GB; the stripper streams it (low memory)
          gzip -dc "$dump" > daemon.hprof
          python3 tools/strip_hprof.py daemon.hprof daemon.stripped.hprof
          rm -f daemon.hprof
          gzip -1 daemon.stripped.hprof
          ls -lh daemon.stripped.hprof.gz

      # Results go to a release (not just artifacts): release assets have fast,
      # stable, publicly accessible download URLs — Actions artifact downloads are slow.
      - name: Publish results as a release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="run-idea-${{ github.run_number }}-${{ matrix.name }}"
          gver=$(basename '${{ steps.urls.outputs.gradle_url }}' | sed -E 's/^gradle-//; s/-(bin|all)\.zip$//')
          dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
          assets=()
          if [ -n "$dump" ]; then
            cp "$dump" daemon.hprof.gz
            size=$(stat -c%s daemon.hprof.gz)
            outcome="OOM reproduced ($size bytes gzipped)"
            # GitHub release assets are capped at 2 GiB — split larger dumps.
            if [ "$size" -gt 2000000000 ]; then
              split -b 1900m daemon.hprof.gz daemon.hprof.gz.part-
              rm daemon.hprof.gz
              assets+=(daemon.hprof.gz.part-*)
              outcome="$outcome, split into $(ls daemon.hprof.gz.part-* | wc -l) parts"
              {
                echo
                echo "**Note:** \`daemon.hprof.gz\` exceeds the 2 GiB release-asset limit and is split into parts. Reassemble with:"
                echo '```'
                echo "cat daemon.hprof.gz.part-* > daemon.hprof.gz"
                echo '```'
              } >> summary.md
            else
              assets+=(daemon.hprof.gz)
            fi
          elif [ "${{ steps.bench.outputs.rc }}" = "0" ]; then
            outcome="sync completed, no OOM"
          else
            outcome="failed, no dump"
          fi
          # stripped variant (primitive arrays zeroed): heap-report builds its MAT
          # indexes from this file. Same 2 GiB split rules as the full dump.
          if [ -f daemon.stripped.hprof.gz ]; then
            ssize=$(stat -c%s daemon.stripped.hprof.gz)
            if [ "$ssize" -gt 2000000000 ]; then
              split -b 1900m daemon.stripped.hprof.gz daemon.stripped.hprof.gz.part-
              # no rm: the S3 step uploads the original as a single object (no splitting on S3)
              assets+=(daemon.stripped.hprof.gz.part-*)
              {
                echo
                echo "**Note:** \`daemon.stripped.hprof.gz\` exceeds the 2 GiB release-asset limit and is split into parts. Reassemble with:"
                echo '```'
                echo "cat daemon.stripped.hprof.gz.part-* > daemon.stripped.hprof.gz"
                echo '```'
              } >> summary.md
            else
              assets+=(daemon.stripped.hprof.gz)
            fi
          fi
          for f in profiler.log summary.md sync.scenarios.ci gradle.properties gradle/wrapper/gradle-wrapper.properties \
                   results/benchmark.csv results/benchmark.html results/studio-sandbox/logs/idea.log model-dumps.tar.gz daemon-logs.tar.gz; do
            [ -f "$f" ] && assets+=("$f")
          done
          ide=$(ls -S heap-dumps/ide/*.hprof.gz 2>/dev/null | head -1)
          [ -n "$ide" ] && cp "$ide" ide.hprof.gz && assets+=(ide.hprof.gz)
          gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$tag" -R '${{ github.repository }}' \
            --title "IDEA sync run #${{ github.run_number }} (${{ matrix.name }}: ${{ matrix.repo }}@$(echo '${{ matrix.sha }}' | cut -c1-12)) — Gradle $gver, daemon ${{ inputs.daemon_xmx }} — $outcome" \
            --notes-file summary.md \
            "${assets[@]}"
          echo "**Results published: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag**" >> "$GITHUB_STEP_SUMMARY"

      # Fast lane for local downloads (GitHub throttles them): mirror everything to the
      # private SeaweedFS S3 except the FULL daemon dump (GitHub-only by decision).
      # Layout: s3://$S3_BUCKET/<release-tag>/<asset>. Never fails the job.
      - name: Upload to S3 (non-fatal)
        if: always()
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_MAX_ATTEMPTS: "10"  # transient 503s under multipart load
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          tag="run-idea-${{ github.run_number }}-${{ matrix.name }}"
          prefix="s3://$S3_BUCKET/$tag"
          # the CF proxy in front of the S3 endpoint is slow per-connection — parallel multipart
          aws configure set default.s3.max_concurrent_requests 16
          aws configure set default.s3.multipart_threshold 16MB
          aws configure set default.s3.multipart_chunksize 16MB
          S3="aws s3 cp --endpoint-url https://s3.kroune.tech"
          if [ -f daemon.stripped.hprof.gz ]; then
            $S3 daemon.stripped.hprof.gz "$prefix/daemon.stripped.hprof.gz"
          else
            echo "no stripped dump — skipping its upload"
          fi
          ide=$(ls -S heap-dumps/ide/*.hprof.gz 2>/dev/null | head -1)
          [ -n "$ide" ] && cp "$ide" ide.hprof.gz && $S3 ide.hprof.gz "$prefix/ide.hprof.gz"
          for f in daemon-logs.tar.gz model-dumps.tar.gz; do
            [ -f "$f" ] && $S3 "$f" "$prefix/$f"
          done
          existing=()
          for f in profiler.log summary.md sync.scenarios.ci gradle.properties gradle/wrapper/gradle-wrapper.properties \
                   results/benchmark.csv results/benchmark.html results/studio-sandbox/logs/idea.log; do
            [ -f "$f" ] && existing+=("$f")
          done
          if [ ${#existing[@]} -gt 0 ]; then
            tar -czf logs.tar.gz "${existing[@]}"
            $S3 logs.tar.gz "$prefix/logs.tar.gz"
          fi

      # Kick off MAT index building in the heap-report repo; a no-op when the PAT
      # secret is absent or no daemon dump was produced.
      - name: Trigger MAT index build (heap-report)
        if: always()
        env:
          PAT: ${{ secrets.HEAP_REPORT_PAT }}
        run: |
          tag="run-idea-${{ github.run_number }}-${{ matrix.name }}"
          if [ -z "$PAT" ]; then
            echo "HEAP_REPORT_PAT not set — skipping index-build dispatch"
            exit 0
          fi
          dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
          if [ -z "$dump" ]; then
            echo "no daemon dump — skipping index-build dispatch"
            exit 0
          fi
          GH_TOKEN="$PAT" gh api repos/kroune/heap-report/dispatches \
            -f event_type=build-indexes \
            -F "client_payload[source_repo]=${{ github.repository }}" \
            -F "client_payload[release_tag]=$tag"
          echo "dispatched build-indexes for $tag"

      - name: Verdict
        if: always()
        run: |
          dump=$(ls -S heap-dumps/daemon/*.hprof.gz 2>/dev/null | head -1)
          if [ -n "$dump" ] && [ "$(stat -c%s "$dump")" -gt 10485760 ]; then
            echo "OK: daemon heap dump captured (OOM reproduced): $dump"
            exit 0
          fi
          if [ "${{ steps.bench.outputs.rc }}" = "0" ]; then
            echo "OK: sync completed without OOM."
            exit 0
          fi
          echo "FAIL: profiler errored and no daemon dump was captured."
          exit 1

  # Downloads both legs' model dumps and diffs them per (project, configuration) file.
  # Lines are compared order-insensitively (sort -u): a configuration may be resolved
  # more than once per sync, which appends duplicate lines; the classpathOrder field is
  # part of every line, so ordering differences still show up as content differences.
  # Files missing on one side are expected when one sync OOMs earlier than the other.
  compare:
    needs: [resolve, sync]
    runs-on: ubuntu-latest
    if: inputs.dump_models
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download model dumps
        run: |
          set -euo pipefail
          mkdir -p base candidate
          gh release download "run-idea-${{ github.run_number }}-base" -R '${{ github.repository }}' \
            -p model-dumps.tar.gz -O base.tar.gz --clobber
          gh release download "run-idea-${{ github.run_number }}-candidate" -R '${{ github.repository }}' \
            -p model-dumps.tar.gz -O candidate.tar.gz --clobber
          tar -xzf base.tar.gz -C base
          tar -xzf candidate.tar.gz -C candidate
          echo "base dump files:      $(find base -type f | wc -l)"
          echo "candidate dump files: $(find candidate -type f | wc -l)"

      - name: Diff model dumps
        run: |
          set -uo pipefail
          {
            echo "# Dependency model diff (run-idea-${{ github.run_number }})"
            echo
            echo "- base: \`${{ inputs.base_repo }}@${{ inputs.base_ref }}\`"
            echo "- candidate: \`${{ inputs.candidate_repo }}@${{ inputs.candidate_ref }}\`"
            echo "- Gradle distribution: ${{ inputs.gradle_distribution_url }}"
            echo
          } > model-diff.md
          only_base=0; only_cand=0; same=0; same_noorder=0; differ=0
          echo '# (none)' > only-base.txt; echo '# (none)' > only-candidate.txt; echo '# (none)' > differing.txt
          for f in $(cd base && find . -type f | sort); do
            if [ ! -f "candidate/$f" ]; then
              echo "$f" >> only-base.txt; only_base=$((only_base+1)); continue
            fi
            if diff -q <(sort -u "base/$f") <(sort -u "candidate/$f") >/dev/null; then
              same=$((same+1))
            # secondary metric: identical except the classpathOrder field (field 6)
            elif diff -q <(sort -u "base/$f" | cut -d'|' -f1-5,7-) <(sort -u "candidate/$f" | cut -d'|' -f1-5,7-) >/dev/null; then
              same_noorder=$((same_noorder+1))
            else
              echo "$f" >> differing.txt; differ=$((differ+1))
            fi
          done
          for f in $(cd candidate && find . -type f | sort); do
            [ -f "base/$f" ] || { echo "$f" >> only-candidate.txt; only_cand=$((only_cand+1)); }
          done
          {
            echo "## Summary"
            echo
            echo "- identical configurations: **$same**"
            echo "- identical except classpathOrder values: **$same_noorder**"
            echo "- differing configurations: **$differ**"
            echo "- only in base (candidate OOM'd earlier or resolved less): $only_base"
            echo "- only in candidate: $only_cand"
            echo
          } >> model-diff.md
          if [ "$differ" -gt 0 ]; then
            echo "## Differing configurations (first 20, unified diff of sorted lines)" >> model-diff.md
            for f in $(head -20 differing.txt); do
              {
                echo
                echo "### \`$f\`"
                echo '```diff'
                diff -u <(sort -u "base/$f") <(sort -u "candidate/$f") 2>/dev/null | head -60 || true
                echo '```'
              } >> model-diff.md
            done
          fi
          cat model-diff.md
          cat model-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish model diff as a release
        if: always()
        run: |
          tag="run-idea-${{ github.run_number }}-model-diff"
          gh release delete "$tag" --yes -R '${{ github.repository }}' 2>/dev/null || true
          gh release create "$tag" -R '${{ github.repository }}' \
            --title "IDEA sync run #${{ github.run_number }} — dependency model diff" \
            --notes-file model-diff.md \
            model-diff.md only-base.txt only-candidate.txt differing.txt
